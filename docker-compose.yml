networks:
  db-todoapp-net:
    driver: bridge
volumes:
  db_data:
    driver: local
services:
  mysql:
    image: todoapp-db:1.0.0
    build: 
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-todoapp
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    networks:
      - db-todoapp-net
  app:
    image: todoapp:1.0.0
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: todoapp
    ports:
      - "8000:8080"
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      - mysql
    networks:
      - db-todoapp-net
    restart: unless-stopped

